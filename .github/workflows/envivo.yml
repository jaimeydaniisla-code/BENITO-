name: Directo y alineaciones
on:
  schedule:
    - cron: '*/10 10-22 * * 5,6,0'   # vie/sáb/dom, cada 10 min (UTC 10-22 = 11-23 h Madrid aprox.)
    - cron: '*/15 18-21 * * 1-4'     # entre semana solo por la tarde-noche
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: envivo
  cancel-in-progress: false
jobs:
  envivo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Directo (FotMob, sin claves ni cupo de OddsPapi)
        run: python modelo_cuotas/envivo.py
      - name: Publicar
        run: |
          git config user.name "robot-benitooo"
          git config user.email "actions@users.noreply.github.com"
          [ -f envivo.json ] && git add envivo.json || true
          git diff --cached --quiet || (git commit -m "Directo" && git pull -q --rebase origin main && git push)
