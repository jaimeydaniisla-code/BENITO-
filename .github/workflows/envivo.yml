name: Directo y alineaciones
on:
  schedule:
    - cron: '*/10 10-22 * * 5,6,0'   # vie/sáb/dom, cada 10 min (UTC 10-22 = 11-23 h Madrid aprox.)
    - cron: '*/15 16-22 * * 1-4'     # entre semana por la tarde-noche (noches de Champions y Europa)
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Mandar un aviso de prueba a los móviles (si/no)'
        default: 'no'
permissions:
  contents: write
concurrency:
  group: envivo
  cancel-in-progress: false
jobs:
  envivo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install pywebpush
      - name: Directo y avisos (FotMob, sin cupo de OddsPapi)
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRUEBA_AVISO: ${{ github.event.inputs.prueba == 'si' && '1' || '' }}
        run: python modelo_cuotas/envivo.py
      - name: Publicar
        run: |
          git config user.name "robot-benitooo"
          git config user.email "actions@users.noreply.github.com"
          [ -f envivo.json ] && git add envivo.json || true
          git diff --cached --quiet || (git commit -m "Directo" && git pull -q --rebase origin main && git push)
