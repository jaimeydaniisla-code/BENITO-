name: Directo, alineaciones y avisos
on:
  schedule:
    - cron: '*/20 9-22 * * 5,6,0'    # vie/sáb/dom: arranca la vigilancia (cada vuelta dura mientras haya partidos)
    - cron: '*/20 15-22 * * 1-4'    # entre semana por la tarde-noche
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Mandar un aviso de prueba a los móviles (si/no)'
        default: 'no'
permissions:
  contents: write
concurrency:
  group: envivo
  cancel-in-progress: false
jobs:
  envivo:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install pywebpush -r requirements.txt
      - name: Vigilar mientras haya partidos (cada ~5 min; GitHub lanza los cron con retraso, así no se pierde ningún aviso)
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRUEBA: ${{ github.event.inputs.prueba == 'si' && '1' || '' }}
        run: |
          git config user.name "robot-benitooo"
          git config user.email "actions@users.noreply.github.com"
          export PRUEBA_AVISO="$PRUEBA"
          for i in $(seq 1 62); do
            git pull -q --rebase origin main || { git rebase --abort 2>/dev/null; git fetch -q origin main; git reset -q --hard origin/main; }
            rc=0; python modelo_cuotas/envivo.py || rc=$?
            export PRUEBA_AVISO=""
            bash .github/scripts/publicar_envivo.sh || echo "AVISO: no se pudo publicar en esta vuelta"
            if [ $rc -eq 3 ]; then echo "Sin partidos cerca: fin de la vigilancia"; break; fi
            sleep 260
          done
