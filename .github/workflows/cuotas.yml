name: cuotas
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 5'     # viernes 09:00 (invierno): cuotas del fin de semana
permissions:
  contents: write
concurrency:
  group: actualizar
  cancel-in-progress: false
jobs:
  cuotas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pedir cuotas de bwin
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python modelo_cuotas/generar_cuotas.py
      - name: Guardar
        run: |
          git config user.name "robot"; git config user.email "robot@users.noreply.github.com"
          git add cuotas.json datos.json
          git diff --staged --quiet || (git commit -m "Cuotas bwin" && git pull -q --rebase origin main && git push)
