name: cuotas
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 5'     # viernes 09:00 (invierno): cuotas del fin de semana (apertura, 4 días)
    - cron: '0 8 * * 1,4'   # lunes y jueves 09:00: apertura de entre semana y del fin de semana (1-2 peticiones cada una)
    - cron: '0 12 * * 6,0'  # sábado y domingo 13:00: cuotas casi de cierre de los partidos de las próximas 10 h
permissions:
  contents: write
concurrency:
  group: actualizar
  cancel-in-progress: false
jobs:
  cuotas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Pedir cuotas de bwin
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          CUOTAS_DIAS: ${{ github.event.schedule == '0 12 * * 6,0' && '1' || '4' }}
          CUOTAS_HORAS: ${{ github.event.schedule == '0 12 * * 6,0' && '10' || '0' }}
          CUOTAS_MAXPET: ${{ github.event.schedule == '0 12 * * 6,0' && '20' || '40' }}
        run: python modelo_cuotas/generar_cuotas.py
      - name: Guardar
        run: |
          git config user.name "robot"; git config user.email "robot@users.noreply.github.com"
          git add -A cuotas.json datos.json modelo_cuotas
          git diff --staged --quiet || (git commit -m "Cuotas bwin" && git pull -q --rebase -X theirs origin main && git push)
