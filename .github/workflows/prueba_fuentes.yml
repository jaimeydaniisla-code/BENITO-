name: prueba_fuentes
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: OddsPapi estructura
        env:
          K: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse
          K = os.environ.get('K', '').strip(); print('clave presente:', bool(K), 'longitud', len(K))
          def get(path, **p):
              u = 'https://api.oddspapi.io/v4' + path + '?' + urllib.parse.urlencode({'apiKey': K, **p})
              try:
                  return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'benitooo'}), timeout=40).read().decode())
              except urllib.error.HTTPError as e:
                  return {'HTTP': e.code, 'body': e.read().decode()[:300]}
          fx = get('/fixtures', tournamentId=8, **{'from': '2026-11-19', 'to': '2026-11-24'})
          if isinstance(fx, dict) and 'HTTP' in fx: print('ERROR fixtures', fx)
          else:
              L = fx.get('data', fx) if isinstance(fx, dict) else fx
              print('fixtures n', len(L)); print(json.dumps(L[0])[:600])
              fid = L[0].get('fixtureId') or L[0].get('id')
              d = get('/odds', fixtureId=fid, bookmakers='bwin.es')
              print('ODDS', json.dumps(d)[:2200])
          PY
