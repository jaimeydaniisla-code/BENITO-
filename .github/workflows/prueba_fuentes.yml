name: prueba_fuentes
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: FotMob ligas selecciones
        run: |
          python3 - <<'PY'
          import re, json, urllib.request
          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=40).read().decode('utf-8', 'ignore')
          for lid, slug in ((9806, 'uefa-nations-league'), (10607, 'friendlies'), (10199, 'concacaf-nations-league'), (10197, 'concacaf-nations-league'), (10609, 'friendlies-clubs')):
              try:
                  pp = json.loads(re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', get(f'https://www.fotmob.com/leagues/{lid}/fixtures/{slug}'), re.S).group(1))['props']['pageProps']
                  nom = pp.get('details', {}).get('name'); allm = pp.get('fixtures', {}).get('allMatches', [])
                  print('LIGA', lid, nom, 'partidos', len(allm))
                  for m in allm:
                      u = m['status'].get('utcTime', '')
                      if u[:10] in ('2026-11-17', '2026-11-18'): print('   ', u, m['home']['name'], '-', m['away']['name'], '| fin', m['status'].get('finished'))
              except Exception as e:
                  print('LIGA', lid, 'error', repr(e)[:100])
          PY
