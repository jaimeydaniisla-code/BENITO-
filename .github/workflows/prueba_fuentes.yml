name: prueba_fuentes
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: FotMob estructura
        run: |
          python3 - <<'PY'
          import re, json, urllib.request
          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=40).read().decode('utf-8', 'ignore')
          def nd(h): return json.loads(re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', h, re.S).group(1))
          pp = nd(get('https://www.fotmob.com/leagues/87/overview/laliga'))['props']['pageProps']
          allm = pp['fixtures']['allMatches']
          print('EJEMPLO partido lista:', json.dumps(allm[0])[:500])
          fin = [m for m in allm if m['status'].get('finished')][-1]; nof = [m for m in allm if not m['status'].get('finished')][0]
          def paths(o, p='', out=None):
              out = [] if out is None else out
              if isinstance(o, dict):
                  for k, v in o.items():
                      q = p + '/' + k
                      if re.search('referee|lineup|starters|formation|unavailable|injur|coach', k, re.I): out.append((q, json.dumps(v)[:260]))
                      paths(v, q, out)
              elif isinstance(o, list):
                  for i, v in enumerate(o[:2]): paths(v, p + f'[{i}]', out)
              return out
          for nombre, m in (('JUGADO', fin), ('FUTURO', nof)):
              g = nd(get('https://www.fotmob.com' + m['pageUrl']))['props']['pageProps']
              print('=====', nombre, m['home']['name'], m['away']['name'])
              for q, v in paths(g)[:14]: print(q, '=>', v)
          PY
