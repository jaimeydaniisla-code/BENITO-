name: diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Estadísticas finales en FotMob
        run: |
          cd modelo_cuotas && python - <<'PY'
          import envivo as E, json
          allm = E.fm_get('https://www.fotmob.com/leagues/87/overview/laliga')['fixtures']['allMatches']
          fin = [f for f in allm if f['status'].get('finished')][-2:]
          for f in fin:
              g = E.fm_get('https://www.fotmob.com' + f['pageUrl'].split('#')[0])['content']
              print('PARTIDO', f['home']['name'], f['away']['name'], f['status'].get('scoreStr'), 'claves content:', list(g.keys()))
              def walk(o, path=''):
                  if isinstance(o, dict):
                      t = str(o.get('title') or o.get('key') or '')
                      if any(w in t.lower() for w in ('corner', 'yellow', 'red card', 'red_card')) and 'stats' in o: print('  ', path, '|', o.get('title'), '|', o.get('key'), '|', o.get('stats'))
                      for k, v in o.items(): walk(v, path + '/' + str(k))
                  elif isinstance(o, list):
                      for i, v in enumerate(o[:60]): walk(v, path + '[' + str(i) + ']')
              walk(g.get('stats'), 'stats')
          PY
