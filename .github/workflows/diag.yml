name: diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  champions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FotMob Champions y ClubElo
        run: |
          python - <<'PY'
          import urllib.request, re, json, datetime as dt
          def get(u):
              h = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}), timeout=40).read().decode('utf-8', 'ignore')
              return json.loads(re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', h, re.S).group(1))['props']['pageProps']
          try:
              p = get('https://www.fotmob.com/leagues/42/overview/champions-league')
              allm = p['fixtures']['allMatches']
              print('claves pageProps:', list(p.keys())[:15]); print('details:', json.dumps(p.get('details'), ensure_ascii=False)[:300])
              fin = [f for f in allm if f['status'].get('finished')]; nxt = [f for f in allm if not f['status'].get('finished')]
              print('total', len(allm), 'terminados', len(fin), 'pendientes', len(nxt))
              print('ULTIMO:', json.dumps(fin[-1], ensure_ascii=False)[:600] if fin else None)
              print('PROXIMO:', json.dumps(nxt[0], ensure_ascii=False)[:600] if nxt else None)
              print('rondas:', sorted({str(f.get('round')) for f in allm})[:20])
              print('equipos:', sorted({f['home']['name'] for f in allm})[:40])
          except Exception as e: print('FOTMOB ERROR', repr(e)[:200])
          import time
          for u in ('http://api.clubelo.com/' + (dt.date.today()-dt.timedelta(days=1)).isoformat(), 'https://api.clubelo.com/' + dt.date.today().isoformat(), 'http://api.clubelo.com/RealMadrid'):
              for k in range(3):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 (benitooo)'}), timeout=40).read().decode()
                      L = r.splitlines(); print('CLUBELO OK', u, len(L), 'filas'); print('\n'.join(L[:3])); print([x for x in L if 'Madrid' in x or 'Bayern' in x][:4]); break
                  except Exception as e:
                      print('CLUBELO ERROR', u, k, repr(e)[:100]); time.sleep(8)
          PY
