name: diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  pinnacle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinnacle en el lote de OddsPapi
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse
          K = os.environ['ODDSPAPI_KEY']
          def get(p, **q):
              q['apiKey'] = K
              return json.loads(urllib.request.urlopen(urllib.request.Request('https://api.oddspapi.io/v4' + p + '?' + urllib.parse.urlencode(q), headers={'User-Agent': 'benitooo'}), timeout=60).read().decode())
          def cnt():
              a = get('/account'); s = json.dumps(a)
              import re; return re.findall(r'"request_(?:count|limit)":\s*\d+', s)
          print('ANTES', cnt())
          r = get('/odds-by-tournaments', tournamentIds='8', bookmakers='bwin.es,pinnacle')
          L = r.get('data', r) if isinstance(r, dict) else r
          print('partidos', len(L))
          for f in L[:3]:
              bo = f.get('bookmakerOdds', {})
              print(f.get('participant1Name'), '-', f.get('participant2Name'), {b: len(v.get('markets', {})) for b, v in bo.items()})
          f = next((f for f in L if 'pinnacle' in f.get('bookmakerOdds', {})), None)
          if f:
              mk = f['bookmakerOdds']['pinnacle']['markets']; print('mercados pinnacle ej.:', list(mk)[:40])
          print('DESPUES', cnt())
          PY
