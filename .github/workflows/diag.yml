name: diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  conexion:
    runs-on: ubuntu-latest
    steps:
      - name: Quién está conectado al registro compartido (solo lectura)
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python3 - <<'PY'
          import os, json, re, datetime as dt, urllib.request
          gid = re.search(r'[0-9a-f]{32}', os.environ['GIST_ID']).group(0)
          g = json.loads(urllib.request.urlopen(urllib.request.Request('https://api.github.com/gists/' + gid, headers={'User-Agent': 'benitooo'}), timeout=30).read())
          f = g['files']['registro.json']; D = json.loads(f['content'] if not f.get('truncated') else urllib.request.urlopen(f['raw_url']).read().decode())
          t = lambda ms: dt.datetime.fromtimestamp(ms / 1000, dt.timezone(dt.timedelta(hours=1))).strftime('%d/%m %H:%M') if ms else '-'
          print('ULTIMA_SINCRO', g.get('updated_at'))
          print('REVISIONES', [h.get('committed_at') for h in g.get('history', [])[:12]])
          for k, v in (D.get('push') or {}).items(): print('MOVIL', k, v.get('nom'), 'avisos', 'OFF' if v.get('off') or not v.get('sub') else 'ON', 'ligas', v.get('ligas'), 'ultimo cambio', t(v.get('u')))
          R = [x for x in D.get('reg', []) if not x.get('del')]
          print('APUESTAS', len(R), 'ultimas', [(x.get('f'), t(x.get('u'))) for x in sorted(R, key=lambda x: x.get('u') or 0)[-4:]])
          bal = st_ = 0
          for x in sorted(R, key=lambda x: x['id']):
              b = x['stake'] * (x['o'] - 1) if x.get('res') == 'G' else -x['stake'] if x.get('res') == 'P' else 0
              if x.get('res') in ('G', 'P'): bal += b; st_ += x['stake']
              print('FILA', x.get('f'), '|', ' + '.join(l['lab'] + ' (' + l.get('partido', '') + ')' for l in x.get('legs', []))[:150], '| cuota', x.get('o'), '| stake', x.get('stake'), '| res', x.get('res'))
          print('BALANCE', round(bal, 2), 'APOSTADO', st_, 'BANCA', D.get('odds', {}).get('__bank'))
          PY
