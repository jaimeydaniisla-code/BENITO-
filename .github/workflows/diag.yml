name: diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  pinnacle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinnacle en el lote de OddsPapi
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse
          K = os.environ['ODDSPAPI_KEY']
          def get(p, **q):
              q['apiKey'] = K
              return json.loads(urllib.request.urlopen(urllib.request.Request('https://api.oddspapi.io/v4' + p + '?' + urllib.parse.urlencode(q), headers={'User-Agent': 'benitooo'}), timeout=60).read().decode())
          def cnt():
              a = get('/account'); s = json.dumps(a)
              import re; return re.findall(r'"request_(?:count|limit)":\s*\d+', s)
          print('ANTES', cnt())
          import urllib.error
          for bk in ('bwin.es,pinnacle', 'pinnacle'):
              try:
                  r = get('/odds-by-tournaments', tournamentIds='8', bookmaker=bk) if ',' not in bk else get('/odds-by-tournaments', tournamentIds='8', bookmakers=bk)
                  L = r.get('data', r) if isinstance(r, dict) else r
                  print(bk, 'partidos', len(L))
                  for f in L[:2]: print('  ', f.get('participant1Name'), {b: len(v.get('markets', {})) for b, v in f.get('bookmakerOdds', {}).items()})
                  f = next((f for f in L if 'pinnacle' in f.get('bookmakerOdds', {})), None)
                  if f: print('  mercados pinnacle:', list(f['bookmakerOdds']['pinnacle']['markets'])[:30])
              except urllib.error.HTTPError as e:
                  print(bk, 'ERROR', e.code, e.read().decode()[:400])
          print('DESPUES', cnt())
          PY
