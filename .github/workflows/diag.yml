name: diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pywebpush
      - name: Aviso de prueba a todos los móviles
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd modelo_cuotas && python -c "
          import envivo as E
          s = E.leer_avisos()
          print('móviles suscritos:', [(k, v.get('nom'), 'activo' if (not v.get('off') and v.get('sub')) else 'desactivado') for k, v in s.items()])
          print('enviados:', E.enviar(s, '⚽ Prueba de Benitooo', 'Si ves esto, los avisos te funcionan. Llegarán antes de cada partido con alineaciones y picks.', 'prueba-amigo'))
          "
