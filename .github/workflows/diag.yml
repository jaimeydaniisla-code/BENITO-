name: diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  casas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Casas españolas en OddsPapi y cobertura NBA/NHL
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          cd modelo_cuotas && python - <<'PY'
          import json, generar_cuotas as G
          b = G.get('/bookmakers'); b = b.get('data', b) if isinstance(b, dict) else b
          slugs = [x.get('slug') or x.get('bookmaker') for x in b] if isinstance(b, list) else list(b)
          es = [s for s in slugs if s and (s.endswith('.es') or s.endswith('-es') or 'spain' in s)]
          print('total casas', len(slugs)); print('ESPAÑOLAS', es)
          r = G.get('/odds-by-tournaments', tournamentIds='132,234,138')   # sin bookmaker: todas las casas
          L = r.get('data', r) if isinstance(r, dict) else r
          from collections import Counter
          c = Counter(k for f in L for k in (f.get('bookmakerOdds') or {}))
          print('partidos', len(L)); print('casas con NBA/NHL/Euroliga (.es):', {k: v for k, v in c.items() if k in es}); print('top', c.most_common(25))
          print('usadas', G.usadas)
          PY
