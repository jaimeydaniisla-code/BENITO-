name: diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  unoxdos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mercado 1X2 de bwin en OddsPapi (1 petición)
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          cd modelo_cuotas && python - <<'PY'
          import json, generar_cuotas as G
          cat = {int(k): v for k, v in json.load(open('catalogo_mercados.json')).items()}
          r = G.get('/odds-by-tournaments', tournamentIds='7', bookmaker='bwin.es'); L = r.get('data', r) if isinstance(r, dict) else r
          f = next(f for f in L if (f.get('bookmakerOdds') or {}).get('bwin.es'))
          mk = f['bookmakerOdds']['bwin.es']['markets']
          print('MERCADOS', len(mk), 'tiene 101:', '101' in mk)
          for mid, v in mk.items():
              c = cat.get(int(mid)) or {}
              if c.get('marketType') in ('1x2', 'doublechance', 'drawnobet') or mid == '101': print('M', mid, c.get('marketName'), c.get('period'), {o: (list(x['players'].values())[0].get('price'), list(x['players'].values())[0].get('active')) for o, x in v['outcomes'].items()})
          print('SIN CATALOGO', [m for m in mk if int(m) not in cat][:20])
          PY
