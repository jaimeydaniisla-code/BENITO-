name: diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  pinnacle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Prueba real bwin + Pinnacle (sin guardar)
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          CUOTAS_PIN: '1'
          CUOTAS_DIAS: '4'
        run: |
          python modelo_cuotas/generar_cuotas.py
          python - <<'PY'
          import json
          cu = json.load(open('cuotas.json'))
          con = [k for k, v in cu.items() if v.get('pin')]
          print('partidos con Pinnacle:', len(con), 'de', len(cu))
          for k in con[:2]: print(k, json.dumps(cu[k]['pin'], ensure_ascii=False)[:300])
          d = json.load(open('datos.json'))
          for lg, L in d['ligas'].items():
              n = sum(1 for j in L['jor'] for m in j['ms'] if m.get('mkp'))
              if n: print(lg, 'partidos con probabilidad de Pinnacle:', n)
          m = next((m for L in d['ligas'].values() for j in L['jor'] for m in j['ms'] if m.get('mkp')), None)
          if m: print(m['h'], m['a'], 'margenes bwin', m.get('mg'), 'goles esperados', m['g'])
          PY
