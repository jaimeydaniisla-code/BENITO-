name: diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fotmob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Estructura de fixtures de FotMob
        run: |
          python - <<'PY'
          import urllib.request, re, json
          def get(u):
              h = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}), timeout=40).read().decode('utf-8', 'ignore')
              return json.loads(re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', h, re.S).group(1))['props']['pageProps']
          for lid, slug in ((140, 'laliga2'), (87, 'laliga'), (47, 'premier-league')):
              allm = get(f'https://www.fotmob.com/leagues/{lid}/overview/{slug}')['fixtures']['allMatches']
              fin = [f for f in allm if f['status'].get('finished')]
              nxt = [f for f in allm if not f['status'].get('finished')]
              print(lid, len(allm), 'terminados', len(fin))
              print(' ULTIMO TERMINADO:', json.dumps(fin[-1], ensure_ascii=False)[:900] if fin else None)
              print(' PROXIMO:', json.dumps(nxt[0], ensure_ascii=False)[:700] if nxt else None)
          PY
