name: diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fixtures de football-data
        run: |
          curl -sS -L -D /tmp/h.txt -A "Mozilla/5.0" -o /tmp/fx.csv -w "http %{http_code} bytes %{size_download}\n" https://www.football-data.co.uk/fixtures.csv || true
          head -12 /tmp/h.txt; ls -la /tmp/fx.csv; head -c 500 /tmp/fx.csv; echo
          test -s /tmp/fx.csv || exit 0
          python - <<'PY'
          import pandas as pd
          d = pd.read_csv('/tmp/fx.csv', encoding='utf-8-sig', on_bad_lines='skip')
          print(d.shape); print(list(d.columns))
          for dv in ('SP1', 'SP2', 'E0'):
              s = d[d.Div == dv]
              print(dv, len(s))
              if len(s):
                  cols = [c for c in ('Date','Time','HomeTeam','AwayTeam','B365H','B365D','B365A','B365>2.5','B365<2.5','AvgH','AvgD','AvgA','Avg>2.5','Avg<2.5','BWH','BWD','BWA') if c in s]
                  print(s[cols].to_string())
          PY
