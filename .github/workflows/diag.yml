name: diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Prueba del radar (grupos A y B, sin guardar)
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          RADAR_GRUPO=A python modelo_cuotas/radar.py
          RADAR_GRUPO=B python modelo_cuotas/radar.py
          python -c "import json;d=json.load(open('radar.json'));print('ejemplo', json.dumps(d['picks'][:2], ensure_ascii=False))"
