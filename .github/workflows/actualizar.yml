name: Actualizar datos
on:
  schedule:
    - cron: '17 * * * *'      # cada hora
  workflow_dispatch:           # botón "Run workflow" para lanzarlo a mano
permissions:
  contents: write
concurrency:
  group: actualizar
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recalcular datos
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          FOOTBALLDATA_TOKEN: ${{ secrets.FOOTBALLDATA_TOKEN }}
        run: python modelo/02_codigo/generar_datos.py
      - name: Recalcular Segunda
        run: python modelo_segunda/02_codigo/generar_segunda.py
      - name: Recalcular Selecciones
        run: python modelo_selecciones/generar_selecciones.py
      - name: Aplicar cuotas bwin guardadas
        run: python modelo_cuotas/generar_cuotas.py --aplicar-solo
      - name: Publicar
        run: |
          git config user.name "robot-benitooo"
          git config user.email "actions@users.noreply.github.com"
          git add datos.json modelo/01_datos/SP1_2026-27.csv modelo_segunda/01_datos/SP2_5.csv modelo_selecciones/resultados_selecciones.csv
          git diff --cached --quiet || (git commit -m "Actualización automática" && git pull -q --rebase origin main && git push)
