name: cuotas-champions
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 2'     # martes 10:00 (invierno): cuotas bwin de la jornada de Champions (martes y miércoles). Sin partidos no gasta peticiones.
permissions:
  contents: write
concurrency:
  group: actualizar
  cancel-in-progress: false
jobs:
  cuotas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Calendario de Champions
        run: python modelo_champions/generar_champions.py
      - name: Pedir cuotas de bwin (solo Champions)
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          CUOTAS_LIGAS: champions
          CUOTAS_DIAS: '2'
          CUOTAS_MAXPET: '24'
        run: python modelo_cuotas/generar_cuotas.py
      - name: Guardar
        run: |
          git config user.name "robot"; git config user.email "robot@users.noreply.github.com"
          git add -A cuotas.json datos.json modelo_cuotas
          git diff --staged --quiet || (git commit -m "Cuotas bwin Champions" && git pull -q --rebase origin main && git push)
